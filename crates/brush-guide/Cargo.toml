[package]
name = "brush-guide"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
brush-render.path = "../brush-render"
brush-train.path = "../brush-train"
brush-dataset.path = "../brush-dataset"
brush-vfs.path = "../brush-vfs"
brush-serde.path = "../brush-serde"
brush-cube.path = "../brush-cube"
brush-async.path = "../brush-async"
clap.workspace = true
burn = { workspace = true, features = ["autodiff"] }
glam.workspace = true
image = { workspace = true, features = ["jpeg"] }
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = "2"
half = "2"
fast-surface-nets = "0.2.1"
anyhow.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "macros"] }
web-time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# `cargo test` compiles every example by default (to catch bit-rot) even
# though it never runs them. score_bench links the full wgpu/Burn/CubeCL
# stack, so that alone adds minutes to every test build; `test = false`
# excludes it. Run it explicitly with `cargo run --release -p brush-guide
# --features brush-cube/metal --example score_bench`.
[[example]]
name = "score_bench"
test = false

[lints]
workspace = true
